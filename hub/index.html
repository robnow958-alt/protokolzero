<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Systemu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0D0D0D] text-[#F2F2F2] min-h-screen flex flex-col items-center px-4 py-8">

    <div id="app" class="w-full max-w-md flex flex-col items-center hidden">
        <div class="flex flex-col items-center text-center mb-8">
            <div id="client-logo" class="w-24 h-24 rounded-full border-2 border-[#333333] mb-4 bg-[#1A1A1A] flex items-center justify-center text-3xl text-zinc-400"></div>
            <h1 id="client-name" class="text-xl font-bold mb-1"></h1>
            <p id="client-tagline" class="text-xs text-zinc-400 uppercase tracking-widest mb-3"></p>
            <p id="client-desc" class="text-sm text-zinc-300 px-4"></p>
        </div>
        <div id="client-links" class="w-full space-y-3 mb-10"></div>
    </div>

    <script>
        const db = {
            "test": {
                name: "PROTOTYP SYSTEMU",
                tagline: "Działa • Kliknij i sprawdź",
                desc: "Jeśli to widzisz, Twój dynamiczny silnik na Cloudflare działa bezbłędnie.",
                logoHtml: '<i class="fa-solid fa-bolt text-amber-400"></i>',
                links: [
                    { title: "MÓJ KANAŁ YT", url: "https://youtube.com", icon: "fa-brands fa-youtube", primary: true },
                    { title: "TWÓJ PROTOKÓŁ ZERO", url: "https://unprinted.pl/", icon: "fa-solid fa-shield", primary: false }
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const clientKey = urlParams.get('client');

        const client = db[clientKey];

        if (client) {
            document.getElementById('client-name').innerText = client.name;
            document.getElementById('client-tagline').innerText = client.tagline;
            document.getElementById('client-desc').innerText = client.desc;
            document.getElementById('client-logo').innerHTML = client.logoHtml;

            const linksContainer = document.getElementById('client-links');
            client.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.className = link.primary 
                    ? "w-full flex items-center justify-between p-4 bg-[#F2F2F2] text-[#0D0D0D] rounded-lg font-semibold"
                    : "w-full flex items-center justify-between p-4 bg-[#1A1A1A] border border-[#333333] rounded-lg text-zinc-200";
                
                a.innerHTML = `<div class="flex items-center gap-3"><i class="${link.icon}"></i><span>${link.title}</span></div>`;
                linksContainer.appendChild(a);
            });
            document.getElementById('app').classList.remove('hidden');
        } else {
            document.body.innerHTML = '<div class="text-center text-zinc-500 mt-20">Wpisz w adresie na końcu: ?client=test</div>';
        }
    </script>
</body>
</html>
